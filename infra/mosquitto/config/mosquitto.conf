# Configuration Mosquitto Sentinel-X (serveur de l'équipe cloud)
# Réglages globaux : s'appliquent aux DEUX écoutes (mot de passe obligatoire + ACL partout).
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

persistence true
persistence_location /mosquitto/data/
max_queued_messages 1000
message_size_limit 4096
log_dest stdout

# Écoute interne pour l'API : réseau Docker uniquement (port 1883 NON publié dans docker-compose.yml).
# Les options "max_connections" et TLS se règlent PAR écoute, juste sous la ligne "listener".
listener 1883
max_connections 5

# Écoute chiffrée TLS pour l'ESP8266, publiée sur le WiFi de table
listener 8883
max_connections 20
cafile /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2
