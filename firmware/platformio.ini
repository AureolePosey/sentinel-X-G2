; Firmware Sentinel-X pour ESP8266 (NodeMCU v2 / v3).
; Si ta carte est une Wemos D1 mini, remplace "nodemcuv2" par "d1_mini".

[env:sentinel]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
upload_speed = 460800

lib_deps =
    knolleary/PubSubClient@^2.8
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit SSD1306@^2.5.11
    adafruit/Adafruit GFX Library@^1.11.10
    bblanchon/ArduinoJson@^7.2.0

; Décommente la ligne suivante pour activer le chiffrement TLS (MQTTS, port 8883)
build_flags = -D USE_TLS
